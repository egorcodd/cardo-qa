global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: cardo
    authorization:
      type: Bearer
      credentials_file: /tmp/cardo-token
    static_configs:
      - targets: ["gateway:8080", "customer:8081", "banking:8082", "engagement:8083", "rates:8084", "telemetry:8086"]

name: cardo-qa
x-app: &app
  restart: unless-stopped
  environment: &common
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:-cardo-local-internal}
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 20
  depends_on:
    db-setup:
      condition: service_completed_successfully
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cardo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardo_local_dev}
      POSTGRES_DB: cardo
    ports: ["127.0.0.1:${DB_PORT:-5434}:5432"]
    volumes:
      - cardo-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-cardo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardo -d cardo"]
      interval: 3s
      timeout: 3s
      retries: 20
  db-setup:
    image: postgres:17-alpine
    restart: "no"
    command: ["sh", "/provision.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-cardo_local_dev}
      POSTGRES_USER: cardo
      POSTGRES_DB: cardo
    volumes: ["./infra/postgres/init.sh:/provision.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy }
  customer:
    <<: *app
    build: { context: ., target: service, args: { SERVICE: customer } }
    environment:
      <<: *common
      PORT: 8081
      DATABASE_URL: postgres://cardo_customer:cardo_customer_dev@postgres:5432/cardo
  banking:
    <<: *app
    build: { context: ., target: service, args: { SERVICE: banking } }
    environment:
      <<: *common
      PORT: 8082
      DATABASE_URL: postgres://cardo_banking:cardo_banking_dev@postgres:5432/cardo
      ENGAGEMENT_URL: http://engagement:8083
      CUSTOMER_URL: http://customer:8081
      RATES_URL: http://rates:8084
  engagement:
    <<: *app
    build: { context: ., target: service, args: { SERVICE: engagement } }
    environment:
      <<: *common
      PORT: 8083
      DATABASE_URL: postgres://cardo_engagement:cardo_engagement_dev@postgres:5432/cardo
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:demo@cardo.local}
  rates:
    <<: *app
    build: { context: ., target: service, args: { SERVICE: rates } }
    environment:
      <<: *common
      PORT: 8084
      DATABASE_URL: postgres://cardo_rates:cardo_rates_dev@postgres:5432/cardo
  gateway:
    <<: *app
    build: { context: ., target: gateway }
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-8942}:8080"]
    environment:
      <<: *common
      PORT: 8080
      CUSTOMER_URL: http://customer:8081
      BANKING_URL: http://banking:8082
      ENGAGEMENT_URL: http://engagement:8083
      RATES_URL: http://rates:8084
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      customer: { condition: service_healthy }
      banking: { condition: service_healthy }
      engagement: { condition: service_healthy }
      rates: { condition: service_healthy }
volumes:
  cardo-data:
